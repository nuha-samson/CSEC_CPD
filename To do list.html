<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f4f4f4;
        }

        h2 {
            text-align: center;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            margin-top: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <h2>Todo App</h2>

    <input type="text" id="todoInput" placeholder="Enter a task">
    <button onclick="addTodo()">Add</button>

    <ul id="todoList"></ul>

    <script>
        let todos = [];

        function displayTodos() {
            let list = document.getElementById("todoList");
            list.innerHTML = "";

            for (let i = 0; i < todos.length; i++) {
                let li = document.createElement("li");

                li.innerHTML =
                    todos[i] +
                    '<button onclick="removeTodo(' + i + ')">Remove</button>';

                list.appendChild(li);
            }
        }

        function addTodo() {
            let input = document.getElementById("todoInput");

            if (input.value !== "") {
                todos.push(input.value);
                input.value = "";
                displayTodos();
            }
        }

        function removeTodo(index) {
            todos.splice(index, 1);
            displayTodos();
        }
    </script>

</body>
</html>
